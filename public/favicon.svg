<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Brand Gradients (Bright & Vivid) -->
    <linearGradient id="ctn-emerald-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="50%" stop-color="#00D285" />
      <stop offset="100%" stop-color="#00A3FF" />
    </linearGradient>

    <linearGradient id="ctn-cyan-blue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A3FF" />
      <stop offset="100%" stop-color="#00F5A0" />
    </linearGradient>

    <linearGradient id="ctn-lightning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="100%" stop-color="#FF9500" />
    </linearGradient>

    <filter id="ctn-soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.1" />
    </filter>

    <filter id="ctn-bolt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#FF9500" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Clean Bright White Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="124" fill="#FFFFFF" filter="url(#ctn-soft-shadow)" stroke="#E6EDF5" stroke-width="6" />

  <!-- Outer Dynamic Transfer Orbit Ring: Top-Right Arc -->
  <path d="M 256 80 A 176 176 0 0 1 432 256 A 176 176 0 0 1 385 366" 
        fill="none" 
        stroke="url(#ctn-emerald-cyan)" 
        stroke-width="36" 
        stroke-linecap="round" />
  
  <!-- Arrow Head on Top Arc -->
  <polygon points="400,380 370,340 436,346" fill="#00A3FF" />

  <!-- Outer Dynamic Transfer Orbit Ring: Bottom-Left Arc -->
  <path d="M 256 432 A 176 176 0 0 1 80 256 A 176 176 0 0 1 127 146" 
        fill="none" 
        stroke="url(#ctn-cyan-blue)" 
        stroke-width="36" 
        stroke-linecap="round" />

  <!-- Arrow Head on Bottom Arc -->
  <polygon points="112,132 142,172 76,166" fill="#00F5A0" />

  <!-- Center Luminous Coin / Badge -->
  <circle cx="256" cy="256" r="102" fill="#F4FBF7" stroke="#D1FAE5" stroke-width="6" />

  <!-- Instant Speed Lightning Bolt (Fast Transfer 24/7) -->
  <g filter="url(#ctn-bolt-glow)">
    <path d="M 266 182 L 216 262 L 254 262 L 240 326 L 298 246 L 260 246 Z" 
          fill="url(#ctn-lightning)" 
          stroke="#FFFFFF" 
          stroke-width="5" 
          stroke-linejoin="round" />
  </g>
</svg>