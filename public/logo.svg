<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Brand Gradients (Bright & Vivid) -->
    <linearGradient id="qrf-brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C853" />
      <stop offset="100%" stop-color="#0091EA" />
    </linearGradient>

    <linearGradient id="qrf-bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9100" />
      <stop offset="100%" stop-color="#FFD600" />
    </linearGradient>

    <!-- Crisp Soft Shadow -->
    <filter id="qrf-soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Bright White Rounded Squircle (Clean, Pops on any tab color) -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="#FFFFFF" filter="url(#qrf-soft-shadow)" stroke="#E0E6ED" stroke-width="6" />

  <!-- QR Corner 1: Top-Left -->
  <g transform="translate(84, 84)">
    <rect x="0" y="0" width="124" height="124" rx="30" fill="none" stroke="url(#qrf-brand)" stroke-width="24" />
    <rect x="36" y="36" width="52" height="52" rx="14" fill="url(#qrf-brand)" />
  </g>

  <!-- QR Corner 2: Top-Right -->
  <g transform="translate(304, 84)">
    <rect x="0" y="0" width="124" height="124" rx="30" fill="none" stroke="url(#qrf-brand)" stroke-width="24" />
    <rect x="36" y="36" width="52" height="52" rx="14" fill="url(#qrf-brand)" />
  </g>

  <!-- QR Corner 3: Bottom-Left -->
  <g transform="translate(84, 304)">
    <rect x="0" y="0" width="124" height="124" rx="30" fill="none" stroke="url(#qrf-brand)" stroke-width="24" />
    <rect x="36" y="36" width="52" height="52" rx="14" fill="url(#qrf-brand)" />
  </g>

  <!-- Decorative QR Data Points -->
  <rect x="238" y="94" width="36" height="36" rx="10" fill="#00C853" />
  <rect x="238" y="162" width="36" height="36" rx="10" fill="#0091EA" />
  <rect x="94" y="238" width="36" height="36" rx="10" fill="#00C853" />
  <rect x="162" y="238" width="36" height="36" rx="10" fill="#0091EA" />

  <!-- Speed Lightning Bolt in Bottom-Right (Vibrant Golden Amber) -->
  <g transform="translate(260, 240)">
    <circle cx="95" cy="95" r="76" fill="#F0FDF4" stroke="#DCFCE7" stroke-width="4" />
    <path d="M102 42 L66 102 L98 102 L86 148 L130 92 L98 92 Z" 
          fill="url(#qrf-bolt)" 
          stroke="#FFFFFF" 
          stroke-width="5" 
          stroke-linejoin="round" />
  </g>
</svg>
